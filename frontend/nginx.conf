server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sin barra final para que Spring Boot no responda 301/404
    location /api/auth          { proxy_pass http://auth-service:8081; }
    location /api/users         { proxy_pass http://user-service:8082; }
    location /api/patients      { proxy_pass http://patient-service:8090; }
    location /api/doctors       { proxy_pass http://doctor-service:8091; }
    location /api/appointments { proxy_pass http://appointment-service:8092; }
    location /api/invoices     { proxy_pass http://billing-service:8085; }
    location /api/pharmacy     { proxy_pass http://pharmacy-service:8088; }
    location /api/reports      { proxy_pass http://report-analyst-service:8086; }

    # Vistas Thymeleaf originales
    location /facturas { proxy_pass http://billing-service:8085; }
    location /reportes { proxy_pass http://report-analyst-service:8086; }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}