server {
    listen 80;
    server_name localhost;

    # --- Vista (dashboard estatico, stub generado) ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Reverse proxy hacia cada microservicio (Imagen 2) ---
    # Un solo origen (http://localhost) evita CORS entre las 9 APIs.
    location /api/auth/ {
        proxy_pass http://auth-service:8081/api/auth/;
    }
    location /api/users/ {
        proxy_pass http://user-service:8082/api/users/;
    }
    location /api/patients/ {
        proxy_pass http://patient-service:8090/api/patients/;
    }
    location /api/doctors/ {
        proxy_pass http://doctor-service:8091/api/doctors/;
    }
    location /api/appointments/ {
        proxy_pass http://appointment-service:8092/api/appointments/;
    }
    location /api/invoices/ {
        proxy_pass http://billing-service:8085/api/invoices/;
    }
    location /api/pharmacy/ {
        proxy_pass http://pharmacy-service:8088/api/pharmacy/;
    }
    location /api/reports/ {
        proxy_pass http://report-analyst-service:8086/api/reports/;
    }

    # --- Vistas Thymeleaf originales, accesibles tambien desde el frontend ---
    location /facturas {
        proxy_pass http://billing-service:8085/facturas;
    }
    location /reportes {
        proxy_pass http://report-analyst-service:8086/reportes;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
