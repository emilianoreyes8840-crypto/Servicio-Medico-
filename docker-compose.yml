version: '3.8'

services:
  # --- INFRAESTRUCTURA BASE ---
  hospital-zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  hospital-kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - hospital-zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: hospital-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://hospital-kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  hospital-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"

  # --- MICROSERVICIOS JAVA ---
  pharmacy-service:
    build: ./pharmacy-service
    ports:
      - "8083:8085" # Mapea el puerto 8083 de tu equipo al 8085 interno de Spring Boot
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hospital-postgres:5432/db_pharmacy
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: hospital-kafka:9092
    depends_on:
      - hospital-postgres
      - hospital-kafka

  notification-service:
    build: ./notification-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hospital-postgres:5432/db_notification
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: hospital-kafka:9092
    depends_on:
      - hospital-postgres
      - hospital-kafka