# =============================================================================
# Hospital Management System - Consolidacion a 3 imagenes Docker (local)
# =============================================================================
# Imagen 1 (db)        -> PostgreSQL unico, con 1 base de datos por servicio.
# Imagen 2 (backend)    -> UNA imagen con los 9 microservicios + eureka-server,
#                          reutilizada en 10 contenedores independientes
#                          (SERVICE_NAME decide cual JAR corre cada uno).
# Imagen 3 (frontend)   -> Nginx: dashboard unico + reverse proxy /api/* hacia
#                          cada microservicio (evita CORS, 1 solo punto de
#                          entrada en http://localhost).
#
# Kafka/Zookeeper se mantienen como infraestructura de mensajeria (imagenes
# oficiales, no construidas por nosotros) porque pharmacy-service,
# billing-service, notification-service y report-analyst-service ya
# dependen de Kafka en su logica real (productores/consumidores existentes).
# Quitarlo habria requerido reescribir esa logica de negocio, lo cual excede
# una "correccion minima". Ver README.md, seccion "Decisiones y observaciones".
# =============================================================================

networks:
  hospital-net:
    driver: bridge

volumes:
  pgdata:

x-backend-image: &backend-image
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: hospital-backend:local
  networks:
    - hospital-net
  restart: unless-stopped

x-backend-env: &backend-env
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  EUREKA_URI: http://eureka-server:8761/eureka/
  JWT_SECRET: ${JWT_SECRET:-aG9zcGl0YWwtbWFuYWdlbWVudC1zeXN0ZW0tYXV0aC1zZXJ2aWNlLWp3dC1zZWNyZXQta2V5LTIwMjYtY2hhbmdlLW1l}

services:
  # ---------------------------------------------------------------------
  # IMAGEN 1 - Capa de Datos
  # ---------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: hospital-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hospital-net
    restart: unless-stopped

  # --- Infraestructura de mensajeria requerida por la logica existente ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: hospital-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - hospital-net
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: hospital-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"
    networks:
      - hospital-net
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # IMAGEN 2 - Capa de Logica / Backend (Modelo + Controlador)
  # Misma imagen "hospital-backend:local" para los 10 contenedores de abajo.
  # ---------------------------------------------------------------------
  eureka-server:
    <<: *backend-image
    container_name: eureka-server
    environment:
      SERVICE_NAME: eureka-server
    ports:
      - "8761:8761"

  auth-service:
    <<: *backend-image
    container_name: auth-service
    environment:
      <<: *backend-env
      SERVICE_NAME: auth-service
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/auth_db
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_started

  user-service:
    <<: *backend-image
    container_name: user-service
    environment:
      <<: *backend-env
      SERVICE_NAME: user-service
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/user_db
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_started

  patient-service:
    <<: *backend-image
    container_name: patient-service
    environment:
      <<: *backend-env
      SERVICE_NAME: patient-service
      SERVER_PORT: 8090
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/patient_db
    ports:
      - "8090:8090"
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_started

  doctor-service:
    <<: *backend-image
    container_name: doctor-service
    environment:
      <<: *backend-env
      SERVICE_NAME: doctor-service
      SERVER_PORT: 8091
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/doctor_db
    ports:
      - "8091:8091"
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_started

  appointment-service:
    <<: *backend-image
    container_name: appointment-service
    environment:
      <<: *backend-env
      SERVICE_NAME: appointment-service
      SERVER_PORT: 8092
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/appointment_db
    ports:
      - "8092:8092"
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_started

  billing-service:
    <<: *backend-image
    container_name: billing-service
    environment:
      <<: *backend-env
      SERVICE_NAME: billing-service
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/billing_db
    ports:
      - "8085:8085"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started

  pharmacy-service:
    <<: *backend-image
    container_name: pharmacy-service
    environment:
      <<: *backend-env
      SERVICE_NAME: pharmacy-service
      # CORRECCION: pharmacy-service traia server.port=8085, igual que
      # billing-service -> choque de puertos al unificar todo en un solo
      # docker-compose. Se reasigna a 8088 (libre en el rango usado).
      SERVER_PORT: 8088
      DB_HOST: db
      DB_PORT: "5432"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pharmacy_db
    ports:
      - "8088:8088"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started

  notification-service:
    <<: *backend-image
    container_name: notification-service
    environment:
      <<: *backend-env
      SERVICE_NAME: notification-service
      SERVER_PORT: 8087
      DB_HOST: db
      DB_PORT: "5432"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/notification_db
      # Mailtrap/SMTP de pruebas: sobreescribir con variables reales si se
      # quiere enviar correo de verdad. Ver .env.example.
      MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-your_mailtrap_username}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your_mailtrap_password}
    ports:
      - "8087:8087"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started

  report-analyst-service:
    <<: *backend-image
    container_name: report-analyst-service
    environment:
      <<: *backend-env
      SERVICE_NAME: report-analyst-service
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/analytics_db
    ports:
      - "8086:8086"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started

  # ---------------------------------------------------------------------
  # IMAGEN 3 - Capa de Presentacion / Frontend (Vista)
  # ---------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: hospital-frontend:local
    container_name: hospital-frontend
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - user-service
      - patient-service
      - doctor-service
      - appointment-service
      - billing-service
      - pharmacy-service
      - notification-service
      - report-analyst-service
    networks:
      - hospital-net
    restart: unless-stopped
