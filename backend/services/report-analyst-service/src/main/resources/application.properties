spring.application.name=report-analyst-service
server.port=8086

# PostgreSQL
spring.datasource.url=jdbc:postgresql://127.0.0.1:5434/analytics_db
spring.datasource.username=postgres
spring.datasource.password=TemachSQL22
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka consumer
spring.kafka.bootstrap-servers=127.0.0.1:29092
spring.kafka.consumer.group-id=report-analyst-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Eureka
eureka.client.service-url.defaultZone=http://127.0.0.1:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Feign (los nombres deben coincidir con spring.application.name de cada servicio registrado en Eureka)
feign.client.config.default.connectTimeout=3000
feign.client.config.default.readTimeout=5000

# Actuator
management.endpoints.web.exposure.include=health,info

# Thymeleaf (desactivar cache en dev; en prod poner true)
spring.thymeleaf.cache=false

logging.level.com.hospital.reports=INFO
