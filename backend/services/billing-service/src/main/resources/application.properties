spring.application.name=billing-service
server.port=8085

# PostgreSQL (billing_db, puerto host 5433 -> distinto de analytics_db en 5434)
spring.datasource.url=jdbc:postgresql://billing-db:5432/billing_db
spring.datasource.username=postgres
spring.datasource.password=TemachSQL22
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka (billing-service corre dentro de Docker, usa el nombre de servicio interno)
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# Eureka
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator
management.endpoints.web.exposure.include=health,info

# Thymeleaf (desactivar cache en dev; en prod poner true)
spring.thymeleaf.cache=false

logging.level.com.hospital.billing=INFO
