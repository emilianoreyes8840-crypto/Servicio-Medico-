# Perfil para correr billing-service DESDE el IDE (IntelliJ), fuera de Docker,
# mientras el resto del stack (Postgres, Kafka, Eureka) sigue corriendo en
# docker-compose. Los nombres de contenedor (billing-db, kafka, eureka-server)
# no se resuelven fuera de la red Docker, asi que aqui usamos localhost + los
# puertos publicados en docker-compose.yml (ver KAFKA_ADVERTISED_LISTENERS).
#
# Para activarlo: agrega -Dspring.profiles.active=local a la VM options de tu
# Run Configuration, o la variable de entorno SPRING_PROFILES_ACTIVE=local.
#
# Mismo patron usado en report-analyst-service (application-local.properties)
# para que ambos servicios puedan correr al mismo tiempo sin chocar puertos:
# billing-db -> 5433 | reports-db -> 5434 | billing-service -> 8085 | report-analyst-service -> 8086

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/billing_db
spring.kafka.bootstrap-servers=127.0.0.1:29092
eureka.client.service-url.defaultZone=http://127.0.0.1:8761/eureka/
eureka.instance.prefer-ip-address=false
