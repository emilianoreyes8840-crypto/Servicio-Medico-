server:
  port: 8090

spring:
  application:
    name: patient-service
  datasource:
    # MIGRADO: antes jdbc:mariadb://patient-db:3306/patient_db (MariaDB).
    url: jdbc:postgresql://db:5432/patient_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Debe coincidir exactamente con auth-service y doctor-service
          secret-key: "${JWT_SECRET:aG9zcGl0YWwtbWFuYWdlbWVudC1zeXN0ZW0tYXV0aC1zZXJ2aWNlLWp3dC1zZWNyZXQta2V5LTIwMjYtY2hhbmdlLW1l}"

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true