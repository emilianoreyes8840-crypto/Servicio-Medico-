server:
  port: 8092

spring:
  application:
    name: appointment-service
  datasource:
    # MIGRADO: antes jdbc:mariadb://appointment-db:3306/appointment_db (MariaDB).
    url: jdbc:postgresql://db:5432/appointment_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true